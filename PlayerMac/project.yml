name: PlayerMac
options:
  developmentLanguage: en
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "14.0"
configFiles:
  Debug: ../Config/PlayerMac.xcconfig
  Release: ../Config/PlayerMac.xcconfig
packages:
  KinroxMusic:
    path: ../Packages/KinroxMusic
  RemoteProtocol:
    path: ../Packages/RemoteProtocol
  # Update framework (owner decision 2026-10-29). Pinned for reproducible releases.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  PlayerMac:
    type: application
    platform: macOS
    productName: Kinrox
    sources:
      - PlayerMac
      - ../Resources/Branding.xcassets
      - ../Resources/Localization
      - path: ../Resources/Spotify
        buildPhase: resources
      - ../Shared
      - path: ../LICENSE
        buildPhase: resources
      - path: ../NOTICE
        buildPhase: resources
      - path: ../LICENSING.md
        buildPhase: resources
      - path: ../TRADEMARKS.md
        buildPhase: resources
      - path: ../SHARED-LICENSE-EXCEPTION.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Kinrox
        PRODUCT_BUNDLE_IDENTIFIER: $(KINROX_BUNDLE_ID_PREFIX).player
        INFOPLIST_FILE: PlayerMac/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: PlayerMac/MPVKit/PlayerMac-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: PlayerMac/PlayerMac.entitlements
    dependencies:
      - target: KinroxSoloistHost
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - package: KinroxMusic
        product: MusicCore
      - package: KinroxMusic
        product: SpotifyWebAPI
      - package: KinroxMusic
        product: MetaBrainzAPI
      - package: RemoteProtocol
        product: RemoteProtocol
      - package: RemoteProtocol
        product: RemoteTransport
      - package: Sparkle
        product: Sparkle
  KinroxSoloistHost:
    type: tool
    platform: macOS
    sources: [SoloistHost]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KINROX_BUNDLE_ID_PREFIX).soloist-host
        OTHER_CODE_SIGN_FLAGS: $(inherited) --identifier $(PRODUCT_BUNDLE_IDENTIFIER)
        OTHER_LDFLAGS: ""
        HEADER_SEARCH_PATHS: ""
        LIBRARY_SEARCH_PATHS: ""
        CODE_SIGN_ENTITLEMENTS: ""
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        PROVISIONING_PROFILE_SPECIFIER: ""
        PROVISIONING_PROFILE: ""
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
  PlayerMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [PlayerMacTests, ../SharedTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KINROX_BUNDLE_ID_PREFIX).player.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: KinroxMusic
        product: MusicCore
      - package: KinroxMusic
        product: SpotifyWebAPI
      - package: KinroxMusic
        product: MetaBrainzAPI
      - target: PlayerMac
      - package: RemoteProtocol
        product: RemoteProtocol
      - package: RemoteProtocol
        product: RemoteTransport
schemes:
  PlayerMac:
    build:
      targets:
        PlayerMac: all
    test:
      targets: [PlayerMacTests]
