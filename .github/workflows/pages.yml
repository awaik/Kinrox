# Publishes the static landing site from site/ to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Landing page

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "Website/**"
      - "Resources/Localization/**"
      - "Scripts/build-site.py"
      - "Scripts/tests/test_site_localization.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify localized pages and links
        run: |
          python3 Scripts/build-site.py --check
          python3 -m unittest discover -s Scripts/tests -p 'test_site_localization.py'
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
