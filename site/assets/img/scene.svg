<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none" role="img" aria-labelledby="t">
<title id="t">A person lies on a couch holding an iPhone. Behind the couch a MacBook and a projector throw a movie onto the wall.</title>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="470" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0b0706"/><stop offset="1" stop-color="#070504"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="470" x2="0" y2="600" gradientUnits="userSpaceOnUse">
    <stop stop-color="#140d0a"/><stop offset="1" stop-color="#020101"/>
  </linearGradient>
  <radialGradient id="spill" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(280 190) scale(470 290)">
    <stop stop-color="#FF7A2E" stop-opacity=".36"/>
    <stop offset=".5" stop-color="#E8231A" stop-opacity=".12"/>
    <stop offset="1" stop-color="#E8231A" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="floorGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(290 486) scale(360 46)">
    <stop stop-color="#FF7A2E" stop-opacity=".22"/><stop offset="1" stop-color="#FF7A2E" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="beam" x1="662" y1="0" x2="526" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFE2B0" stop-opacity=".62"/><stop offset="1" stop-color="#FFB25C" stop-opacity=".07"/>
  </linearGradient>
  <linearGradient id="beamWide" x1="662" y1="0" x2="40" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFE2B0" stop-opacity=".16"/><stop offset=".35" stop-color="#FFB25C" stop-opacity=".04"/><stop offset="1" stop-color="#FFB25C" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="flare" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(662 302) scale(30)">
    <stop stop-color="#FFF3DC" stop-opacity=".95"/><stop offset=".35" stop-color="#FFB25C" stop-opacity=".45"/><stop offset="1" stop-color="#FF5A1F" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="couch" x1="418" y1="0" x2="942" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#45221a"/><stop offset=".45" stop-color="#26150f"/><stop offset="1" stop-color="#150d0a"/>
  </linearGradient>
  <linearGradient id="couchBack" x1="446" y1="0" x2="914" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#2b1610"/><stop offset="1" stop-color="#100907"/>
  </linearGradient>
  <linearGradient id="blanket" x1="556" y1="400" x2="740" y2="470" gradientUnits="userSpaceOnUse">
    <stop stop-color="#7a321c"/><stop offset=".55" stop-color="#4a1f14"/><stop offset="1" stop-color="#26110b"/>
  </linearGradient>
  <radialGradient id="phoneGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(780 404) scale(58)">
    <stop stop-color="#FFA23A" stop-opacity=".55"/><stop offset=".45" stop-color="#FF5A1F" stop-opacity=".18"/><stop offset="1" stop-color="#FF5A1F" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="phoneScreen" x1="0" y1="-11" x2="0" y2="11" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFB25C"/><stop offset="1" stop-color="#FF5A1F"/>
  </linearGradient>
  <linearGradient id="macScreen" x1="0" y1="250" x2="0" y2="312" gradientUnits="userSpaceOnUse">
    <stop stop-color="#1B0F2B"/><stop offset=".45" stop-color="#5E1A2E"/><stop offset=".75" stop-color="#E8541F"/><stop offset="1" stop-color="#2A0F1B"/>
  </linearGradient>
  <radialGradient id="macGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(786 282) scale(70 54)">
    <stop stop-color="#FF7A2E" stop-opacity=".2"/><stop offset="1" stop-color="#FF7A2E" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#E8241A"/><stop offset=".55" stop-color="#FF591F"/><stop offset="1" stop-color="#FFA33B"/>
  </linearGradient>
  <!-- Ember Dusk still from Figma (Media/Video Still/Ember Dusk). -->
  <linearGradient id="ed-sky" x1="0" y1="0" x2="0" y2="810" gradientUnits="userSpaceOnUse">
    <stop stop-color="#1B0F2B"/><stop offset="0.38" stop-color="#5E1A2E"/><stop offset="0.62" stop-color="#E8541F"/><stop offset="0.72" stop-color="#FFB25C"/>
  </linearGradient>
  <radialGradient id="ed-sun" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(936 504) scale(270)">
    <stop stop-color="#FFE2B0" stop-opacity="0.85"/><stop offset="1" stop-color="#FFB25C" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ed-haze" x1="0" y1="468" x2="0" y2="576" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFB25C" stop-opacity="0"/><stop offset="1" stop-color="#E8541F" stop-opacity="0.35"/>
  </linearGradient>
  <linearGradient id="scrimTop" x1="0" y1="0" x2="0" y2="150" gradientUnits="userSpaceOnUse">
    <stop stop-opacity=".55"/><stop offset="1" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="scrimBottom" x1="0" y1="489" x2="0" y2="810" gradientUnits="userSpaceOnUse">
    <stop stop-opacity="0"/><stop offset="1" stop-opacity=".72"/>
  </linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
  <!-- Person as rounded strokes; drawn twice for a warm rim light from the screen. -->
  <g id="person" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="870" cy="407" r="18" fill="currentColor" stroke="none"/>
    <path d="M858 418L846 428" stroke-width="15"/>
    <path d="M722 452Q784 448 842 432" stroke-width="36"/>
    <circle cx="840" cy="434" r="19" fill="currentColor" stroke="none"/>
    <path d="M834 442Q808 458 798 451L783 416" stroke-width="13"/>
    <path d="M722 456L600 456" stroke-width="30"/>
    <ellipse cx="552" cy="449" rx="10" ry="7" transform="rotate(-20 552 449)" fill="currentColor" stroke="none"/>
    <ellipse cx="549" cy="462" rx="10" ry="6" transform="rotate(-8 549 462)" fill="currentColor" stroke="none"/>
  </g>
</defs>

